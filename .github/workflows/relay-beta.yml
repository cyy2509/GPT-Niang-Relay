name: Windows Beta Release
on:
  push:
    tags: ['v1.4.0-beta.5']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: windows-js
      - run: npm run prepare:runtime
        working-directory: windows-js
      - run: npm run package:beta -- --output ../dist/javascript-beta
        working-directory: windows-js
      - name: Publish verified Windows bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = Get-Item dist/javascript-beta/*-windows-js.zip
          $sums = 'dist/javascript-beta/SHA256SUMS.txt'
          if ((Get-FileHash $zip.FullName).Hash -ne ((Get-Content $sums) -split '\s+')[0]) { throw 'Checksum mismatch' }
          gh release create $env:GITHUB_REF_NAME $zip.FullName $sums --verify-tag --prerelease --title 'GPT Niang Relay v1.4.0-beta.5' --notes-file windows-js/RELEASE_NOTES.md
          if ($LASTEXITCODE) { throw 'Release publication failed' }
